<div class="bg-white shadow-md rounded-lg overflow-hidden">
    <div class="p-4 border-b border-gray-200">
        <div class="flex justify-between items-center">
            <p class="text-sm font-medium text-gray-900">
                From: {{ email.sender_email or 'N/A' }}
            </p>
            <p class="text-sm text-gray-500">
                To: {{ email.recipient_email }}
            </p>
        </div>
        <p class="text-sm text-gray-600 mt-1">
            <strong>Subject:</strong> {{ email.subject_line }}
        </p>
    </div>
    <div class="p-4">
        <p class="text-sm text-gray-700 whitespace-pre-wrap">{{ email.content }}</p>
    </div>
    <div class="p-4 bg-gray-50 border-t border-gray-200">
        <div class="flex justify-between items-center">
            <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full 
                {% if email.status == 'SENT' %} bg-blue-100 text-blue-800
                {% elif email.status == 'DELIVERED' %} bg-green-100 text-green-800
                {% elif email.status == 'OPENED' %} bg-yellow-100 text-yellow-800
                {% elif email.status == 'CLICKED' %} bg-indigo-100 text-indigo-800
                {% elif email.status == 'REPLIED' %} bg-purple-100 text-purple-800
                {% elif email.status == 'FAILED' %} bg-red-100 text-red-800
                {% elif email.status == 'SPAM' %} bg-pink-100 text-pink-800
                {% elif email.status == 'UNSUBSCRIBED' %} bg-gray-100 text-gray-800
                {% elif email.status == 'RECEIVED' %} bg-gray-100 text-gray-800
                {% else %} bg-gray-100 text-gray-800 {% endif %}">
                {{ email.status }}
            </span>
            <p class="text-xs text-gray-500">
                {{ email.sent_at.strftime('%Y-%m-%d %H:%M') if email.sent_at else 'N/A' }}
            </p>
        </div>
    </div>
</div>
